<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Job \"Jey\" Njoroge builds customer acquisition infrastructure for businesses that want more qualified conversations without bloated software overhead.">
  <title>JOB / JEY NJOROGE</title>
  <style>
    :root{
      --navy:#0b0f19;
      --slate:#131a2e;
      --cyan:#38bdf8;
      --cyan-soft:#7dd3fc;
      --white:#f8fafc;
      --muted:#aeb8ca;
      --line:rgba(255,255,255,.12);
      --glass:rgba(14,19,30,.8)
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--navy);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white)}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .page{width:min(1200px,calc(100% - 32px));display:grid;grid-template-columns:1fr;gap:18px}
    .brandbar{
      width:100%;
      background:rgba(11,15,25,.95);
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 12px 40px rgba(0,0,0,.25)
    }
    .brand-inner{
      padding:12px 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      letter-spacing:.18em;
      font-size:clamp(16px,2vw,22px);
      font-weight:900;
      color:var(--white);
      text-transform:uppercase;
      background:linear-gradient(180deg,#0d1320,#090d16)
    }
    .brand-inner .slash{color:var(--cyan);margin:0 10px}
    .brand-inner .cyan{color:var(--cyan)}
    .hero{
      position:relative;
      width:100%;
      min-height:620px;
      border-radius:20px;
      overflow:hidden;
      background:#d9d3cb;
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 18px 60px rgba(0,0,0,.25)
    }
    .hero img{
      display:block;
      width:100%;
      height:620px;
      object-fit:cover;
      object-position:center top;
      background:#d9d3cb
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.05) 100%);
      pointer-events:none
    }
    @media (max-width:700px){
      .hero,.hero img{height:480px}
      .brand-inner{letter-spacing:.12em;font-size:14px;padding:10px 12px}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brandbar">
      <div class="brand-inner"><span>JOB</span><span class="slash">/</span><span class="cyan">JEY NJOROGE</span></div>
    </div>
    <div class="hero">
      <img src="profile.jpg" alt="Job \"Jey\" Njoroge portrait" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(180deg,#d9d3cb,#cfc8c1)';this.parentElement.style.display='flex';this.parentElement.style.alignItems='center';this.parentElement.style.justifyContent='center';this.parentElement.innerHTML='<div style=\"width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#0b0f19;font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:28px;text-align:center;\">JOB / JEY NJOROGE</div>'">
    </div>
  </div>
</body>
</html>
