<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content='Job "Jey" Njoroge builds customer acquisition infrastructure for businesses that want more qualified conversations without bloated software overhead.'>
  <title>Customer Acquisition Pipeline</title>
  <style>
    :root{--navy:#0b0f19;--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--navy);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .page{width:min(1200px,calc(100% - 32px))}
    .hero{position:relative;width:100%;min-height:620px;border-radius:20px;overflow:hidden;background:#d9d3cb;border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.25)}
    .hero img{display:block;width:100%;height:620px;object-fit:cover;object-position:center top;background:#d9d3cb}
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.05) 100%);pointer-events:none}
    @media(max-width:700px){.hero,.hero img{height:480px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="hero">
      <img src="./profile.jpg?v=2" alt='Job "Jey" Njoroge portrait'>
    </div>
  </main>
</body>
</html>
