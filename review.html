<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Request a conversion review for your landing page, lead generation, or customer journey.">
  <title>Request a Conversion Review | Conversion Systems Designer</title>
  <style>:root{--navy:#0b0f19;--slate:#131a2e;--cyan:#38bdf8;--cyan-soft:#7dd3fc;--white:#f8fafc;--muted:#aeb8ca}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--white);font-family:Inter,system-ui,sans-serif}.wrap{width:min(860px,calc(100% - 36px));margin:auto;padding:64px 0}.card{padding:38px 30px;background:var(--slate);border:1px solid rgba(56,189,248,.35);border-radius:18px;box-shadow:0 25px 70px #0006}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title{margin:16px 0 12px;font-size:clamp(32px,6vw,54px);line-height:1;letter-spacing:-.05em}.lead{margin:0 0 28px;color:var(--muted);font-size:17px;line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin-top:18px}label{display:block;margin-bottom:8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}input,textarea{width:100%;padding:15px;border:1px solid #3d4b64;border-radius:8px;background:#0b1020;color:var(--white);font:inherit}textarea{min-height:130px;resize:vertical}button{width:100%;margin-top:18px;padding:16px;border:0;border-radius:8px;background:var(--cyan);color:var(--navy);font:inherit;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}button:hover{background:var(--cyan-soft)}.back{display:block;margin-top:22px;color:var(--cyan);text-align:center;text-decoration:none}@media(max-width:700px){.wrap{padding:40px 0}.card{padding:26px 20px}.grid{grid-template-columns:1fr}}</style>
</head>
<body><main class="wrap"><div class="card"><div class="eyebrow">Request a review</div><h1 class="title">Tell me what you need to improve.</h1><p class="lead">Share a few details and I’ll reply with practical next steps for your landing page, lead generation, or follow-up process.</p><form action="thank-you.html" method="get"><div class="grid"><div><label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your name"></div><div><label for="business">Business</label><input id="business" name="business" type="text" placeholder="Your business name"></div><div><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@yourbusiness.com" required></div><div><label for="goal">Main goal</label><input id="goal" name="goal" type="text" placeholder="More inquiries, bookings, or sales"></div></div><div class="field"><label for="details">What needs attention?</label><textarea id="details" name="details" placeholder="Tell me about your current page, email process, audience, and what you want to improve."></textarea></div><button type="submit">Send my review request</button></form><a class="back" href="index.html">← Back to the homepage</a></div></main></body>
</html>
